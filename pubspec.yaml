name: myiuj_portal
description: "MyIUJ! — Campus portal for the International University of Japan."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wiki/01-Residential-Life/
    - assets/wiki/02-Academics/faculty/
    - assets/wiki/02-Academics/general-procedures/
    - assets/wiki/02-Academics/gsim/
    - assets/wiki/02-Academics/gsir/
    - assets/wiki/03-Campus-Life-and-Organizations/
    - assets/wiki/04-Administration/
    - assets/wiki/04-Administration/academic-affairs/
    - assets/wiki/04-Administration/admissions-enrollment/
    - assets/wiki/04-Administration/career-support/
    - assets/wiki/04-Administration/facilities-campus/
    - assets/wiki/04-Administration/financial/
    - assets/wiki/04-Administration/immigration/
    - assets/wiki/04-Administration/library/
    - assets/wiki/04-Administration/research/
    - assets/wiki/04-Administration/student-services/
